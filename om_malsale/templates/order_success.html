<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<title>Order Successful | Om Masale</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(
        135deg,
        #fff7e6,
        #ffe7cc,
        #fff1dc
    );
}

.success-box{
    width:100%;
    max-width:650px;
    background:rgba(255,255,255,.9);
    padding:40px 30px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 25px 70px rgba(120,70,10,.2);
}

.success-icon{
    font-size:80px;
    margin-bottom:15px;
}

h1{
    color:#7a3100;
    font-size:32px;
    margin-bottom:10px;
}

.subtitle{
    color:#6b4b2a;
    margin-bottom:25px;
}

.order-info{
    background:#fff8f2;
    border:1px solid #f3d5b5;
    border-radius:20px;
    padding:20px;
    margin-bottom:25px;
    text-align:left;
}

.order-info p{
    margin:10px 0;
    color:#333;
    line-height:1.6;
}

.order-info strong{
    color:#7a3100;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:9px 16px;
    border-radius:999px;
    background:#eab308;
    color:#fff;
    font-weight:700;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    flex:1;
    min-width:180px;
    padding:14px 18px;
    border-radius:20px;
    text-decoration:none;
    font-weight:700;
    color:#fff;
    background:linear-gradient(
        135deg,
        #ff8a00,
        #ff6b6b
    );
}

.btn.secondary{
    background:#7a3100;
}

@media(max-width:500px){
    .success-box{
        padding:30px 18px;
    }

    h1{
        font-size:26px;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="success-box">

    <div class="success-icon">
        ✅
    </div>

    <h1>
        Order Placed Successfully!
    </h1>

    <div class="subtitle">
        Thank you for ordering from Om Masale.
    </div>

    <div class="order-info">

        <p>
            <strong>Order ID:</strong>
            #{{ order.id }}
        </p>

        <p>
            <strong>Name:</strong>
            {{ order.name }}
        </p>

        <p>
            <strong>Total:</strong>
            ₹{{ order.total }}
        </p>

        <p>
            <strong>Status:</strong>
            <span class="status">
                {{ order.get_status_display }}
            </span>
        </p>

    </div>

    <div class="buttons">

        <a href="{% url 'track_orders' %}" class="btn">
            Track My Order
        </a>

        <a href="{% url 'home' %}" class="btn secondary">
            Continue Shopping
        </a>

    </div>

</div>

</body>
</html>
